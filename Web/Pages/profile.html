<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Customer Account & Order Status Bhopal | Laundry Basket</title>
  <meta name="description" content="Access your customer profile, view your active prepaid memberships, track order pickup status, and manage addresses with Laundry Basket Bhopal.">
  <meta name="keywords" content="my laundry account bhopal, customer login laundry basket, track order status bhopal, laundry history bhopal">
  <link rel="canonical" href="https://www.laundrybasketunicorn.com/Pages/profile.html">
  <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
  <link rel="icon" type="image/png" href="../images/logo.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script defer src="../assets/js/scripts.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    .profile-container {
      padding: 100px 0 60px;
      min-height: 80vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(15, 46, 87, 0.08);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 48px;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      background: var(--brand);
      color: white;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      box-shadow: 0 15px 35px rgba(26, 111, 219, 0.2);
    }

    .profile-info h1 { margin: 0; font-size: 2rem; font-weight: 800; }
    .profile-info p { margin: 8px 0 0; color: var(--muted); font-size: 1.1rem; }

    .history-section {
      margin-top: 48px;
    }

    .history-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .order-item {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .order-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border-color: var(--brand);
    }

    .order-meta h4 { margin: 0; font-size: 1.1rem; color: var(--brand); }
    .order-meta p { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }

    .order-status {
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .status-pending { background: #fff7ed; color: #c2410c; }
    .status-completed { background: #f0fdf4; color: #15803d; }
    .status-processing { background: #eff6ff; color: #1d4ed8; }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .profile-header { flex-direction: column; text-align: center; gap: 20px; }
      .order-item { flex-direction: column; align-items: flex-start; gap: 20px; }
      .order-total { width: 100%; display: flex; justify-content: space-between; }
    }

    /* Premium Tracking Stepper Styles */
    .tracking-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .tracking-card {
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 36px;
      box-shadow: 0 30px 60px rgba(15, 46, 87, 0.15);
      overflow: hidden;
      animation: trackingModalAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes trackingModalAppear {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .tracking-header {
      background: linear-gradient(135deg, var(--brand) 0%, #1d4ed8 100%);
      color: white;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .tracking-header h3 {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 0 0 4px;
      letter-spacing: -0.5px;
    }

    .tracking-header p {
      font-size: 0.9rem;
      opacity: 0.85;
      margin: 0;
      font-weight: 500;
    }

    .tracking-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .tracking-close:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }

    .tracking-body {
      padding: 30px;
      overflow-y: auto;
      flex: 1;
    }

    .tracking-body::-webkit-scrollbar {
      width: 6px;
    }
    .tracking-body::-webkit-scrollbar-thumb {
      background: rgba(26, 111, 219, 0.2);
      border-radius: 10px;
    }

    /* Stepper Timeline */
    .timeline-container {
      position: relative;
      margin: 10px 0;
    }

    .timeline-item {
      display: flex;
      gap: 20px;
      position: relative;
      padding-bottom: 24px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::after {
      content: '';
      position: absolute;
      left: 20px;
      top: 40px;
      bottom: 0;
      width: 3px;
      background: #e2e8f0;
      z-index: 1;
    }

    .timeline-item.completed::after {
      background: var(--brand);
    }

    .timeline-item:last-child::after {
      display: none;
    }

    .timeline-icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 3px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 2;
      transition: all 0.3s ease;
      color: #94a3b8;
    }

    .timeline-item.completed .timeline-icon-wrapper {
      background: #eff6ff;
      border-color: var(--brand);
      color: var(--brand);
      box-shadow: 0 0 0 4px rgba(26, 111, 219, 0.1);
    }

    .timeline-item.active .timeline-icon-wrapper {
      background: var(--brand);
      border-color: var(--brand);
      color: white;
      font-size: 1.3rem;
      box-shadow: 0 0 0 6px rgba(26, 111, 219, 0.2);
      animation: pulseActiveGlow 2s infinite;
    }

    @keyframes pulseActiveGlow {
      0% { box-shadow: 0 0 0 0px rgba(26, 111, 219, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(26, 111, 219, 0); }
      100% { box-shadow: 0 0 0 0px rgba(26, 111, 219, 0); }
    }

    .timeline-content {
      flex: 1;
      padding-top: 6px;
    }

    .timeline-title {
      font-size: 1rem;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 4px;
      transition: color 0.3s ease;
    }

    .timeline-item.active .timeline-title {
      color: var(--brand);
    }

    .timeline-desc {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
      line-height: 1.4;
    }

    .timeline-item.pending .timeline-title {
      color: #cbd5e1;
    }

    .timeline-item.pending .timeline-desc {
      color: #cbd5e1;
    }

    /* Rider details card inside tracker */
    .rider-card {
      background: rgba(26, 111, 219, 0.05);
      border: 1px solid rgba(26, 111, 219, 0.1);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .rider-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rider-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--brand);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .rider-name {
      font-weight: 700;
      color: #1e293b;
      font-size: 0.95rem;
    }

    .rider-title {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rider-call-btn {
      background: var(--brand);
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(26, 111, 219, 0.2);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .rider-call-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(26, 111, 219, 0.3);
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container profile-container">
    <div class="glass-card">
      <div class="profile-header">
        <div class="profile-avatar" id="user-initial">U</div>
        <div class="profile-info">
          <h1 id="user-name">Welcome Back</h1>
          <p id="user-phone">+91 00000 00000</p>
          <div style="margin-top: 20px; display: flex; gap: 15px;">
            <button class="button button-dark" style="padding: 8px 20px; font-size: 0.85rem;" onclick="handleLogout()">
              <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
            </button>
            <a href="booking.html" class="button button-accent" style="padding: 8px 20px; font-size: 0.85rem; text-decoration: none;">
              <i class="fas fa-plus" style="margin-right: 8px;"></i> New Booking
            </a>
          </div>
        </div>
      </div>

      <div class="history-section">
        <h3 class="history-title"><i class="fas fa-history" style="color: var(--brand);"></i> Recent Orders</h3>
        <div id="order-history-list">
          <!-- Orders injected here -->
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <!-- Invoice Modal -->
  <div id="invoice-modal" class="modal-overlay" style="display: none;">
    <div class="glass-card" style="max-width: 500px; width: 90%; padding: 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.4);">
        <div style="background: var(--brand); color: white; padding: 30px; text-align: center;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 8px;">Your Invoice</div>
            <h2 id="inv-id" style="font-weight: 800; margin: 0;">#ID-1000</h2>
        </div>
        
        <div style="padding: 30px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 0.9rem;">
                <div>
                    <div style="color: var(--muted); margin-bottom: 4px;">Billed To:</div>
                    <div id="inv-name" style="font-weight: 700; color: var(--brand-dark);">Customer Name</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--muted); margin-bottom: 4px;">Date:</div>
                    <div id="inv-date" style="font-weight: 700; color: var(--brand-dark);">April 25, 2025</div>
                </div>
            </div>

            <div id="inv-items" style="background: rgba(15, 23, 42, 0.03); border-radius: 16px; padding: 20px; margin-bottom: 24px;">
                <!-- Items injected here -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 2px dashed var(--border);">
                <span style="font-weight: 700; color: var(--muted);">Grand Total</span>
                <span id="inv-total" style="font-size: 1.5rem; font-weight: 800; color: var(--brand);">₹0</span>
            </div>

            <div style="margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="button button-dark" onclick="document.getElementById('invoice-modal').style.display='none'">
                    Close
                </button>
                <button class="button button-accent" id="whatsapp-share-btn">
                    <i class="fab fa-whatsapp" style="margin-right: 8px;"></i> Share Details
                </button>
            </div>
        </div>
    </div>
  </div>

  <!-- Tracking Modal -->
  <div id="tracking-modal" class="tracking-overlay" style="display: none;">
      <div class="tracking-card">
          <div class="tracking-header">
              <button class="tracking-close" onclick="closeTrackingModal()">✕</button>
              <p>Live Order Status Tracker</p>
              <h3 id="track-order-id">#ID-1000</h3>
          </div>
          
          <div class="tracking-body">
              <!-- Rider details injected here -->
              <div id="track-rider-container"></div>
              
              <!-- Stepper injected here -->
              <div class="timeline-container" id="track-stepper-container">
                  <!-- Steps injected here -->
              </div>
          </div>
      </div>
  </div>

  <script>
    async function loadProfile() {
      const user = JSON.parse(localStorage.getItem('laundry_user'));
      if (!user) {
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-phone').innerText = '+91 ' + user.phone;
      document.getElementById('user-initial').innerText = user.name.charAt(0).toUpperCase();

      const listContainer = document.getElementById('order-history-list');
      listContainer.innerHTML = Array.from({length: 3}).map(() => `
        <div class="order-item" style="animation: pulse 1.5s infinite; pointer-events: none;">
          <div class="order-meta" style="width: 60%;">
            <div style="height: 20px; background: rgba(0,0,0,0.06); border-radius: 6px; width: 40%; margin-bottom: 12px;"></div>
            <div style="height: 14px; background: rgba(0,0,0,0.06); border-radius: 6px; width: 30%; margin-bottom: 8px;"></div>
            <div style="height: 14px; background: rgba(0,0,0,0.06); border-radius: 6px; width: 50%;"></div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; width: 30%;">
             <div style="height: 24px; background: rgba(0,0,0,0.06); border-radius: 6px; width: 50%;"></div>
             <div style="height: 32px; background: rgba(0,0,0,0.06); border-radius: 16px; width: 70%;"></div>
          </div>
        </div>
      `).join('');

      const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? 'http://localhost:5000/api' : '/api';
      let userOrders = [];
      try {
          const res = await fetch(`${API_BASE}/orders/my-orders`, {
              headers: { 'Authorization': `Bearer ${user.token}` }
          });
          userOrders = await res.json();
      } catch (err) { console.error("Error fetching history:", err); }

      const listContainer = document.getElementById('order-history-list');

      if (userOrders.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i>
            <p>You haven't placed any orders yet.</p>
            <a href="services.html" style="color: var(--brand); font-weight: 700; text-decoration: none;">Browse Services</a>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = userOrders.map(order => `
        <div class="order-item" data-order-id="${order.id}">
          <div class="order-meta">
            <h4>${order.id}</h4>
            <p><i class="fas fa-calendar-alt" style="margin-right: 6px;"></i> ${order.timestamp}</p>
            <p><i class="fas fa-tshirt" style="margin-right: 6px;"></i> ${Array.isArray(order.services) ? order.services.join(', ') : order.services}</p>
          </div>
          
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
            <div style="font-size: 1.2rem; font-weight: 800; color: var(--brand);">₹${order.total}</div>
            <div style="display: flex; gap: 8px;">
              <span class="order-status status-${order.status.toLowerCase().replace(/\s+/g, '-')}">${order.status}</span>
              <button class="btn-action" style="background: #10b981; color: white; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="trackOrder('${order.id}')" title="Track Order">
                <i class="fas fa-route"></i>
              </button>
              <button class="btn-action" style="background: var(--brand); color: white; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="viewInvoice('${order.id}')" title="View Invoice">
                <i class="fas fa-file-invoice"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      window.userOrders = userOrders;
    }

    function trackOrder(id) {
        const order = window.userOrders.find(o => o.id === id);
        if (!order) return;
        
        window.activeTrackingOrderId = id;
        document.getElementById('track-order-id').innerText = order.id;
        
        const riderContainer = document.getElementById('track-rider-container');
        if (order.assignedRiderId) {
            const riderName = order.assignedRiderName || 'Your Rider';
            const riderPhone = order.assignedRiderPhone || '';
            const initial = riderName.charAt(0).toUpperCase();
            
            riderContainer.innerHTML = `
                <div class="rider-card">
                    <div class="rider-info">
                        <div class="rider-avatar">${initial}</div>
                        <div>
                            <div class="rider-title">Assigned Delivery Agent</div>
                            <div class="rider-name">${riderName}</div>
                        </div>
                    </div>
                    ${riderPhone ? `
                        <a href="tel:${riderPhone}" class="rider-call-btn" title="Call Rider">
                            <i class="fas fa-phone"></i>
                        </a>
                    ` : ''}
                </div>
            `;
            riderContainer.style.display = 'block';
        } else {
            riderContainer.style.display = 'none';
        }

        const trackingSteps = [
          { key: 'Pending', label: 'Order Placed', desc: 'Order received and is pending approval', icon: '🧺' },
          { key: 'Out for Pickup', label: 'Out for Pickup', desc: 'Rider is on the way to pick up your clothes', icon: '🛵' },
          { key: 'Pickup done', label: 'Pickup Done', desc: 'Clothes picked up successfully', icon: '🎒' },
          { key: 'Delivered at store', label: 'At Store', desc: 'Clothes delivered to laundry branch', icon: '🏪' },
          { key: 'Processing', label: 'Processing', desc: 'Clothes are being sorted and prepared', icon: '⚙️' },
          { key: 'Washing', label: 'Washing', desc: 'Clothes are being washed in premium wash cycles', icon: '🧼' },
          { key: 'Drying', label: 'Drying', desc: 'Clothes are being dried and checked', icon: '💨' },
          { key: 'Ironing', label: 'Ironing', desc: 'Clothes are being ironed and steam-pressed', icon: '👔' },
          { key: 'Ready', label: 'Ready for Delivery', desc: 'Clothes are packed and ready to go', icon: '✨' },
          { key: 'Out for Delivery', label: 'Out for Delivery', desc: 'Rider is out to deliver your clean clothes', icon: '🚚' },
          { key: 'Delivered to Cx', label: 'Delivered & Complete', desc: 'Delivered back to you! Thank you!', icon: '✅' }
        ];

        const currentStatus = order.status;
        let activeIndex = trackingSteps.findIndex(step => step.key.toLowerCase() === currentStatus.toLowerCase());
        
        if (activeIndex === -1) {
            const sLower = currentStatus.toLowerCase();
            if (sLower.includes('completed') || sLower.includes('delivered to cx') || sLower.includes('delivered')) {
                activeIndex = trackingSteps.length - 1;
            } else if (sLower.includes('at store') || sLower.includes('delivered at store')) {
                activeIndex = 3;
            } else if (sLower.includes('pickup done')) {
                activeIndex = 2;
            } else if (sLower.includes('out for pickup')) {
                activeIndex = 1;
            }
        }
        
        if (activeIndex === -1) activeIndex = 0;

        const stepperContainer = document.getElementById('track-stepper-container');
        stepperContainer.innerHTML = trackingSteps.map((step, idx) => {
            let itemClass = 'pending';
            if (idx < activeIndex) {
                itemClass = 'completed';
            } else if (idx === activeIndex) {
                itemClass = 'active';
            }
            
            return `
                <div class="timeline-item ${itemClass}">
                    <div class="timeline-icon-wrapper">
                        ${step.icon}
                    </div>
                    <div class="timeline-content">
                        <h4 class="timeline-title">${step.label}</h4>
                        <p class="timeline-desc">${step.desc}</p>
                    </div>
                </div>
            `;
        }).join('');

        setTimeout(() => {
            const activeItem = stepperContainer.querySelector('.timeline-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }, 150);

        document.getElementById('tracking-modal').style.display = 'flex';
    }

    function closeTrackingModal() {
        document.getElementById('tracking-modal').style.display = 'none';
        window.activeTrackingOrderId = null;
    }

    function viewInvoice(id) {
        const order = window.userOrders.find(o => o.id === id);
        if (!order) return;

        document.getElementById('inv-id').innerText = order.id;
        document.getElementById('inv-name').innerText = order.name;
        document.getElementById('inv-date').innerText = order.timestamp || new Date().toLocaleDateString();
        document.getElementById('inv-total').innerText = '₹' + order.total;

        let itemsHtml = '';
        if (order.amount_estimate_details && order.amount_estimate_details.length > 0) {
            itemsHtml = order.amount_estimate_details.map(item => `
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;">
                    <span style="color: var(--brand-dark);">${order.service_type || 'Wash & Iron'} - ${item.matchedItem || item.rawName} (${item.qty} pcs)</span>
                    <span style="font-weight: 600;">₹${item.amount}</span>
                </div>
            `).join('');
        } else {
            const items = order.itemSummary ? order.itemSummary.split(', ') : (Array.isArray(order.services) ? order.services : [order.services || 'Laundry Service']);
            // If any item contains newline, split it!
            const cleanItems = [];
            items.forEach(i => {
                String(i).split('\n').forEach(line => {
                    if (line.trim()) cleanItems.push(line.trim());
                });
            });
            itemsHtml = cleanItems.map(item => `
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;">
                    <span style="color: var(--brand-dark);">${item}</span>
                    <span style="font-weight: 600;">Included</span>
                </div>
            `).join('');
        }
        document.getElementById('inv-items').innerHTML = itemsHtml;

        document.getElementById('whatsapp-share-btn').onclick = () => {
            const message = `*My Laundry Order Details*%0A%0A*Order ID:* ${order.id}%0A*Status:* ${order.status}%0A*Total:* ₹${order.total}%0A%0A_Sent from Laundry Basket Portal_`;
            window.open(`https://wa.me/?text=${message}`, '_blank');
        };

        document.getElementById('invoice-modal').style.display = 'flex';
    }

    function handleLogout() {
      window.logoutCustomer();
    }

    // ⚡ Real-Time Order Status Updates
    function connectRealTimeUpdates(phone) {
      const SOCKET_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:5000' : window.location.origin;
      const socket = io(SOCKET_BASE);

      const cleanPhone = phone.replace(/\D/g, '').slice(-10);
      socket.emit('join_room', { role: 'customer', phone: cleanPhone });

      socket.on('order_updated', ({ order }) => {
        if (!order) return;

        // Update in-memory userOrders list
        if (window.userOrders) {
            const idx = window.userOrders.findIndex(o => o.id === order.id);
            if (idx > -1) {
                window.userOrders[idx] = { ...window.userOrders[idx], ...order };
            }
        }

        // Find the order card and update status in-place
        const card = document.querySelector(`[data-order-id="${order.id}"]`);
        if (card) {
          const statusEl = card.querySelector('.order-status');
          if (statusEl) {
            statusEl.textContent = order.status;
            statusEl.className = `order-status status-${order.status.toLowerCase().replace(/\s+/g, '-')}`;
          }
          // Flash animation to indicate update
          card.style.transition = 'box-shadow 0.5s';
          card.style.boxShadow = '0 0 0 3px rgba(26,111,219,0.5)';
          setTimeout(() => { card.style.boxShadow = ''; }, 1500);
        } else {
          loadProfile();
        }

        // Live refresh the open tracking modal
        if (window.activeTrackingOrderId === order.id) {
            trackOrder(order.id);
        }
      });

      socket.on('order_created', () => loadProfile());
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadProfile();
      const user = JSON.parse(localStorage.getItem('laundry_user'));
      if (user && user.phone) connectRealTimeUpdates(user.phone);
    });
  </script>
</body>

</html>
