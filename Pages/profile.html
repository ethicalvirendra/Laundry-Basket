<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Laundry Basket</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script defer src="../assets/js/scripts.js"></script>
  <style>
    .profile-container {
      padding: 100px 0 60px;
      min-height: 80vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 32px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(15, 46, 87, 0.08);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 48px;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      background: var(--brand);
      color: white;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 800;
      box-shadow: 0 15px 35px rgba(26, 111, 219, 0.2);
    }

    .profile-info h1 { margin: 0; font-size: 2rem; font-weight: 800; }
    .profile-info p { margin: 8px 0 0; color: var(--muted); font-size: 1.1rem; }

    .history-section {
      margin-top: 48px;
    }

    .history-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .order-item {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .order-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border-color: var(--brand);
    }

    .order-meta h4 { margin: 0; font-size: 1.1rem; color: var(--brand); }
    .order-meta p { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }

    .order-status {
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .status-pending { background: #fff7ed; color: #c2410c; }
    .status-completed { background: #f0fdf4; color: #15803d; }
    .status-processing { background: #eff6ff; color: #1d4ed8; }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .profile-header { flex-direction: column; text-align: center; gap: 20px; }
      .order-item { flex-direction: column; align-items: flex-start; gap: 20px; }
      .order-total { width: 100%; display: flex; justify-content: space-between; }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container profile-container">
    <div class="glass-card">
      <div class="profile-header">
        <div class="profile-avatar" id="user-initial">U</div>
        <div class="profile-info">
          <h1 id="user-name">Welcome Back</h1>
          <p id="user-phone">+91 00000 00000</p>
          <div style="margin-top: 20px; display: flex; gap: 15px;">
            <button class="button button-dark" style="padding: 8px 20px; font-size: 0.85rem;" onclick="handleLogout()">
              <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
            </button>
            <a href="booking.html" class="button button-accent" style="padding: 8px 20px; font-size: 0.85rem; text-decoration: none;">
              <i class="fas fa-plus" style="margin-right: 8px;"></i> New Booking
            </a>
          </div>
        </div>
      </div>

      <div class="history-section">
        <h3 class="history-title"><i class="fas fa-history" style="color: var(--brand);"></i> Recent Orders</h3>
        <div id="order-history-list">
          <!-- Orders injected here -->
        </div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <!-- Invoice Modal -->
  <div id="invoice-modal" class="modal-overlay" style="display: none;">
    <div class="glass-card" style="max-width: 500px; width: 90%; padding: 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.4);">
        <div style="background: var(--brand); color: white; padding: 30px; text-align: center;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 8px;">Your Invoice</div>
            <h2 id="inv-id" style="font-weight: 800; margin: 0;">#ID-1000</h2>
        </div>
        
        <div style="padding: 30px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 0.9rem;">
                <div>
                    <div style="color: var(--muted); margin-bottom: 4px;">Billed To:</div>
                    <div id="inv-name" style="font-weight: 700; color: var(--brand-dark);">Customer Name</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--muted); margin-bottom: 4px;">Date:</div>
                    <div id="inv-date" style="font-weight: 700; color: var(--brand-dark);">April 25, 2025</div>
                </div>
            </div>

            <div id="inv-items" style="background: rgba(15, 23, 42, 0.03); border-radius: 16px; padding: 20px; margin-bottom: 24px;">
                <!-- Items injected here -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 2px dashed var(--border);">
                <span style="font-weight: 700; color: var(--muted);">Grand Total</span>
                <span id="inv-total" style="font-size: 1.5rem; font-weight: 800; color: var(--brand);">₹0</span>
            </div>

            <div style="margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="button button-dark" onclick="document.getElementById('invoice-modal').style.display='none'">
                    Close
                </button>
                <button class="button button-accent" id="whatsapp-share-btn">
                    <i class="fab fa-whatsapp" style="margin-right: 8px;"></i> Share Details
                </button>
            </div>
        </div>
    </div>
  </div>

  <script>
    function loadProfile() {
      const user = JSON.parse(localStorage.getItem('laundry_user'));
      if (!user) {
        window.location.href = '../index.html';
        return;
      }

      document.getElementById('user-name').innerText = user.name;
      document.getElementById('user-phone').innerText = '+91 ' + user.phone;
      document.getElementById('user-initial').innerText = user.name.charAt(0).toUpperCase();

      const API_BASE = 'http://localhost:5000/api';
      let userOrders = [];
      try {
          const res = await fetch(`${API_BASE}/orders`); // For demo, we fetch all and filter client-side
          const allOrders = await res.json();
          userOrders = allOrders.filter(b => b.phone === user.phone);
      } catch (err) { console.error("Error fetching history:", err); }

      const listContainer = document.getElementById('order-history-list');

      if (userOrders.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-shopping-basket" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.3;"></i>
            <p>You haven't placed any orders yet.</p>
            <a href="services.html" style="color: var(--brand); font-weight: 700; text-decoration: none;">Browse Services</a>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = userOrders.map(order => `
        <div class="order-item">
          <div class="order-meta">
            <h4>${order.id}</h4>
            <p><i class="fas fa-calendar-alt" style="margin-right: 6px;"></i> ${order.timestamp}</p>
            <p><i class="fas fa-tshirt" style="margin-right: 6px;"></i> ${order.services}</p>
          </div>
          
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px;">
            <div style="font-size: 1.2rem; font-weight: 800; color: var(--brand);">₹${order.total}</div>
            <div style="display: flex; gap: 8px;">
              <span class="order-status status-${order.status.toLowerCase()}">${order.status}</span>
              <button class="btn-action" style="background: var(--brand); color: white; border: none; border-radius: 8px; width: 32px; height: 32px; cursor: pointer;" onclick="viewInvoice('${order.id}')">
                <i class="fas fa-file-invoice"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      window.userOrders = userOrders;
    }

    function viewInvoice(id) {
        const order = window.userOrders.find(o => o.id === id);
        if (!order) return;

        document.getElementById('inv-id').innerText = order.id;
        document.getElementById('inv-name').innerText = order.name;
        document.getElementById('inv-date').innerText = order.timestamp || new Date().toLocaleDateString();
        document.getElementById('inv-total').innerText = '₹' + order.total;

        const items = order.itemSummary ? order.itemSummary.split(', ') : [order.services];
        document.getElementById('inv-items').innerHTML = items.map(item => `
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;">
                <span style="color: var(--brand-dark);">${item}</span>
                <span style="font-weight: 600;">Included</span>
            </div>
        `).join('');

        document.getElementById('whatsapp-share-btn').onclick = () => {
            const message = `*My Laundry Order Details*%0A%0A*Order ID:* ${order.id}%0A*Status:* ${order.status}%0A*Total:* ₹${order.total}%0A%0A_Sent from Laundry Basket Portal_`;
            window.open(`https://wa.me/?text=${message}`, '_blank');
        };

        document.getElementById('invoice-modal').style.display = 'flex';
    }

    function handleLogout() {
      localStorage.removeItem('laundry_user');
      window.location.href = '../index.html';
    }

    window.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>

</html>
