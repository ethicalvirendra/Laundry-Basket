<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Manager | Laundry Basket</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script defer src="../assets/js/scripts.js"></script>
  <script>
    // Authentication Guard - Immediate Execution
    (function() {
        const token = localStorage.getItem('lb_auth_token');
        const role = localStorage.getItem('lb_user_role');
        if (!token || (role !== 'manager' && role !== 'admin')) {
            window.location.href = 'login.html';
        }
    })();

    function handleLogout() {
        localStorage.removeItem('lb_auth_token');
        localStorage.removeItem('lb_user_role');
        localStorage.removeItem('lb_user_name');
        localStorage.removeItem('lb_store_id');
        window.location.href = 'login.html';
    }
  </script>
  <style>
    .manager-container {
      padding: 100px 0 60px;
      min-height: 90vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(15, 46, 87, 0.08);
    }

    .manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .store-badge {
      background: var(--brand);
      color: white;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .filter-pill {
      padding: 10px 20px;
      border-radius: 12px;
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .filter-pill.active {
      background: var(--brand-dark);
      color: white;
      border-color: var(--brand-dark);
    }

    .order-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr 1fr;
      align-items: center;
      gap: 24px;
      transition: transform 0.3s ease;
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .order-id {
      font-weight: 800;
      color: var(--brand);
      font-size: 1.1rem;
    }

    .customer-info h4 { margin: 0; font-size: 1rem; }
    .customer-info p { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }

    .status-dropdown {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.85rem;
      width: 100%;
      cursor: pointer;
    }

    .btn-action {
      background: #eff6ff;
      color: var(--brand);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      background: var(--brand);
      color: white;
    }

    @media (max-width: 992px) {
      .order-card {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 576px) {
      .order-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <!-- Login Overlay removed as we use login.html -->

  <div class="container manager-container">
    <div class="manager-header">
      <div>
        <h1 class="section-title" style="margin: 0;">Store <span>Operations</span></h1>
        <div style="display: flex; gap: 10px; margin-top: 8px;">
            <div class="store-badge"><i class="fas fa-store"></i> <span id="current-store-name">Main Branch</span></div>
            <div id="active-count-badge" style="background: #fef2f2; color: #dc2626; padding: 8px 16px; border-radius: 99px; font-size: 0.85rem; font-weight: 700;">3 Urgent Orders</div>
        </div>
      </div>
      <div style="display: flex; gap: 15px;">
        <button class="button button-accent" onclick="openManualBookingModal()">
          <i class="fas fa-plus" style="margin-right: 8px;"></i> New Walk-in Order
        </button>
        <button class="button button-dark" onclick="handleLogout()">
          <i class="fas fa-sign-out-alt" style="margin-right: 8px;"></i> Logout
        </button>
      </div>
    </div>

    <!-- Manual Booking Modal -->
    <div id="manual-booking-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2500; align-items: center; justify-content: center;">
        <div class="glass-card" style="width: 100%; max-width: 500px; padding: 40px; position: relative;">
            <h2 style="font-weight: 800; margin-bottom: 24px;"><i class="fas fa-user-plus" style="color: var(--brand); margin-right: 12px;"></i> Walk-in Order</h2>
            
            <div class="form-group">
                <label class="form-label">Customer Name</label>
                <input type="text" id="walkin-name" class="booking-input" placeholder="Enter customer name" style="background: white;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="walkin-phone" class="booking-input" placeholder="10-digit mobile" style="background: white;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label class="form-label">Services (Comma separated)</label>
                <input type="text" id="walkin-services" class="booking-input" placeholder="Wash & Iron, Dry Clean" style="background: white;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label class="form-label">Total Amount (₹)</label>
                <input type="number" id="walkin-total" class="booking-input" placeholder="0.00" style="background: white;">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 32px;">
                <button class="button button-accent" style="flex: 1;" onclick="saveManualOrder()">Place Order</button>
                <button class="button button-dark" onclick="document.getElementById('manual-booking-modal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <div class="filter-bar">
      <button class="filter-pill active" onclick="filterOrders('All')">All Orders</button>
      <button class="filter-pill" onclick="filterOrders('Pending')">Pending Pickup</button>
      <button class="filter-pill" onclick="filterOrders('Processing')">Processing</button>
      <button class="filter-pill" onclick="filterOrders('Out for Delivery')">Out for Delivery</button>
      <button class="filter-pill" onclick="filterOrders('Completed')">Completed</button>
    </div>

    <div id="orders-list">
      <!-- Order cards will be injected here -->
    </div>
  </div>

  <div id="site-footer"></div>

  <!-- Invoice Modal -->
  <div id="invoice-modal" class="modal-overlay" style="display: none;">
    <div class="glass-card" style="max-width: 500px; width: 90%; padding: 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.4);">
        <div style="background: var(--brand); color: white; padding: 30px; text-align: center;">
            <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 8px;">Official Invoice</div>
            <h2 id="inv-id" style="font-weight: 800; margin: 0;">#ID-1000</h2>
        </div>
        
        <div style="padding: 30px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 0.9rem;">
                <div>
                    <div style="color: var(--muted); margin-bottom: 4px;">Billed To:</div>
                    <div id="inv-name" style="font-weight: 700; color: var(--brand-dark);">Customer Name</div>
                    <div id="inv-phone" style="color: var(--muted);">+91 0000000000</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: var(--muted); margin-bottom: 4px;">Date:</div>
                    <div id="inv-date" style="font-weight: 700; color: var(--brand-dark);">April 25, 2025</div>
                </div>
            </div>

            <div id="inv-items" style="background: rgba(15, 23, 42, 0.03); border-radius: 16px; padding: 20px; margin-bottom: 24px;">
                <!-- Items injected here -->
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 20px; border-top: 2px dashed var(--border);">
                <span style="font-weight: 700; color: var(--muted);">Grand Total</span>
                <span id="inv-total" style="font-size: 1.5rem; font-weight: 800; color: var(--brand);">₹0</span>
            </div>

            <div style="margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <button class="button button-dark" onclick="document.getElementById('invoice-modal').style.display='none'">
                    Close
                </button>
                <button class="button button-accent" id="whatsapp-share-btn">
                    <i class="fab fa-whatsapp" style="margin-right: 8px;"></i> Share on WhatsApp
                </button>
            </div>
        </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    let currentFilter = 'All';
    let storeOrders = [];
    const storeId = localStorage.getItem('lb_store_id');
    const storeName = localStorage.getItem('lb_user_name');

    function checkSession() {
        document.getElementById('current-store-name').innerText = storeName || 'Branch';
        loadStoreOrders();
    }

    function openManualBookingModal() {
        document.getElementById('manual-booking-modal').style.display = 'flex';
    }

    async function saveManualOrder() {
        const name = document.getElementById('walkin-name').value;
        const phone = document.getElementById('walkin-phone').value;
        const services = document.getElementById('walkin-services').value;
        const total = document.getElementById('walkin-total').value;

        if (!name || !phone || !services) { alert('Please fill all required fields.'); return; }

        // Fetch store data
        const res = await fetch(`${API_BASE}/stores`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('lb_auth_token')}` }
        });
        const stores = await res.json();
        const store = stores.find(s => s.id === storeId);

        // Generate ID using Username + 1000 offset
        const userPrefix = (store.user || 'LB').toUpperCase();
        const baseCounter = store.nextOrderId || 1;
        const orderId = `${userPrefix}-${1000 + baseCounter}`;

        const newOrder = {
            id: orderId,
            storeId: store.id,
            name,
            phone,
            services,
            itemSummary: 'Walk-in Order',
            total: total || 0,
            address: 'Store Walk-in',
            status: 'Processing'
        };

        try {
            await fetch(`${API_BASE}/orders`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('lb_auth_token')}`
                },
                body: JSON.stringify(newOrder)
            });

            await fetch(`${API_BASE}/stores/${store.id}/counter`, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('lb_auth_token')}`
                },
                body: JSON.stringify({ nextOrderId: baseCounter + 1 })
            });

            document.getElementById('manual-booking-modal').style.display = 'none';
            loadStoreOrders();
            alert(`Order ${orderId} placed successfully!`);
        } catch (err) { alert("Error saving order."); }
    }

    async function loadStoreOrders() {
      if (!storeId) return;

      try {
          const res = await fetch(`${API_BASE}/orders/store/${storeId}`, {
              headers: { 'Authorization': `Bearer ${localStorage.getItem('lb_auth_token')}` }
          });
          
          if (res.status === 401 || res.status === 403) {
              handleLogout();
              return;
          }
          
          storeOrders = await res.json();
      } catch (err) { console.error(err); }

      const ordersContainer = document.getElementById('orders-list');
      const urgentBadge = document.getElementById('active-count-badge');

      const filtered = currentFilter === 'All' 
        ? storeOrders 
        : storeOrders.filter(b => b.status === currentFilter);

      const urgentCount = storeOrders.filter(b => b.status === 'Pending').length;
      urgentBadge.innerText = `${urgentCount} Pending Pickup`;
      urgentBadge.style.display = urgentCount > 0 ? 'block' : 'none';

      if (filtered.length === 0) {
        ordersContainer.innerHTML = `
          <div class="glass-card" style="text-align: center; padding: 60px;">
            <i class="fas fa-clipboard-list" style="font-size: 3rem; color: var(--border); margin-bottom: 20px;"></i>
            <h3 style="color: var(--muted);">No orders found for "${currentFilter}"</h3>
          </div>
        `;
        return;
      }

      ordersContainer.innerHTML = filtered.map(order => `
        <div class="order-card">
          <div class="order-id-box">
            <span class="order-id">${order.id}</span>
            <p style="margin: 4px 0 0; font-size: 0.75rem; color: var(--muted);">${order.timestamp || ''}</p>
          </div>
          
          <div class="customer-info">
            <h4>${order.name}</h4>
            <p><i class="fas fa-map-marker-alt" style="margin-right: 6px;"></i> ${order.address}</p>
            <p><i class="fas fa-phone" style="margin-right: 6px;"></i> ${order.phone}</p>
          </div>

          <div>
            <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 8px;">Order Status</div>
            <select class="status-dropdown" onchange="updateOrderStatus('${order.id}', this.value)" style="border-color: ${getStatusColor(order.status)}">
              <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending Pickup</option>
              <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
              <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
              <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
              <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
            </select>
          </div>

          <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn-action" title="View Details" onclick="viewOrderDetails('${order.id}')">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn-action" title="View/Share Invoice" onclick="viewOrderDetails('${order.id}')">
                <i class="fas fa-file-invoice"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function getStatusColor(status) {
      switch(status) {
        case 'Pending': return '#f97316';
        case 'Processing': return '#3b82f6';
        case 'Out for Delivery': return '#8b5cf6';
        case 'Completed': return '#22c55e';
        default: return 'var(--border)';
      }
    }

    function filterOrders(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(status) || (status === 'All' && btn.innerText === 'All Orders'));
      });
      loadStoreOrders();
    }

    async function updateOrderStatus(id, newStatus) {
      try {
          const res = await fetch(`${API_BASE}/orders/${id}`, {
              method: 'PUT',
              headers: { 
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${localStorage.getItem('lb_auth_token')}`
              },
              body: JSON.stringify({ status: newStatus })
          });
          if (res.ok) loadStoreOrders();
      } catch (err) { alert("Error updating status"); }
    }

    function viewOrderDetails(id) {
        const order = storeOrders.find(o => o.id === id);
        if (!order) return;

        document.getElementById('inv-id').innerText = order.id;
        document.getElementById('inv-name').innerText = order.name;
        document.getElementById('inv-phone').innerText = '+91 ' + order.phone;
        document.getElementById('inv-date').innerText = order.timestamp || new Date().toLocaleDateString();
        document.getElementById('inv-total').innerText = '₹' + order.total;

        const items = order.itemSummary ? order.itemSummary.split(', ') : [order.services];
        document.getElementById('inv-items').innerHTML = items.map(item => `
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem;">
                <span style="color: var(--brand-dark);">${item}</span>
                <span style="font-weight: 600;">Included</span>
            </div>
        `).join('');

        // WhatsApp Share Logic
        document.getElementById('whatsapp-share-btn').onclick = () => {
            const message = `*Laundry Basket Invoice*%0A%0A*Order ID:* ${order.id}%0A*Customer:* ${order.name}%0A*Services:* ${order.services}%0A*Total:* ₹${order.total}%0A%0ATrack your order here: https://laundrybasket.co.in/index.html?track=${order.id}%0A%0A_Thank you for choosing Laundry Basket!_`;
            window.open(`https://wa.me/91${order.phone}?text=${message}`, '_blank');
        };

        document.getElementById('invoice-modal').style.display = 'flex';
    }

    window.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>

</html>
