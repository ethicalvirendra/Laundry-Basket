<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detailed Services List | Laundry Basket</title>
  <meta name="description"
    content="Explore our detailed laundry and dry cleaning price list. Transparent pricing for all garments, shoes, and household items.">
  <link rel="canonical" href="https://laundrybasket.co.in/Pages/services.html">
  <link rel="icon" type="image/png" href="../assets/images/favicon_circle.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script defer src="../assets/js/scripts.js"></script>
</head>

<body>
  <div id="site-header"></div>
  
  <div class="container" style="padding: 40px 0 60px;">
    <section class="section">
      <div class="section-header">
        <span class="section-subtitle">Transparent Pricing</span>
        <h1 class="section-title">Our Detailed <span>Services List</span></h1>
        <p class="section-text">Browse our full range of professional garment care services.</p>
      </div>

      <div class="rate-tabs" style="margin-top: 30px;">
        <button class="rate-tab-btn active" onclick="showRate('dry-clean')">Dry Cleaning</button>
        <button class="rate-tab-btn" onclick="showRate('steam-iron')">Steam Iron</button>
        <button class="rate-tab-btn" onclick="showRate('shoe-clean')">Shoe Cleaning</button>
        <button class="rate-tab-btn" onclick="showRate('wash-iron')">Wash & Iron</button>
      </div>

      <div class="rate-sub-tabs" style="margin-bottom: 30px;">
        <button class="sub-tab-btn active" onclick="setGender('Men')">For Men</button>
        <button class="sub-tab-btn" onclick="setGender('Women')">For Women</button>
      </div>

      <div id="dry-clean" class="rate-content active">
        <div class="compact-rate-list"></div>
      </div>
      <div id="steam-iron" class="rate-content">
        <div class="compact-rate-list"></div>
      </div>
      <div id="shoe-clean" class="rate-content">
        <div class="compact-rate-list"></div>
      </div>
      <div id="wash-iron" class="rate-content">
        <div class="compact-rate-list"></div>
      </div>

      <div style="text-align: center; margin-top: 40px; padding: 25px; background: #f8fafc; border-radius: 20px; border: 1px solid var(--border);">
        <h3 style="margin-bottom: 5px; color: var(--brand-dark); font-size: 1rem;">Can't find an item?</h3>
        <p style="color: var(--muted); margin-bottom: 15px; font-size: 0.85rem;">Proceed to booking and our rider will assist you.</p>
        <a href="booking.html" class="button button-accent" style="padding: 10px 30px; border-radius: 99px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; font-size: 0.9rem;">
          <i class="fas fa-calendar-check"></i> Book Now
        </a>
      </div>
    </section>
  </div>

  <div id="site-footer"></div>

  <script>
    let currentGender = 'Men';
    let activeCategory = 'dry-clean';

    function showRate(categoryId) {
      activeCategory = categoryId;
      document.querySelectorAll('.rate-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.rate-tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(categoryId).classList.add('active');
      if (event) event.currentTarget.classList.add('active');
      renderRates();
    }

    function setGender(gender) {
      currentGender = gender;
      document.querySelectorAll('.sub-tab-btn').forEach(el => {
        el.classList.remove('active');
        if (el.innerText.includes(gender)) el.classList.add('active');
      });
      renderRates();
    }

    async function renderRates() {
      // Force refresh if it looks like old data (missing Men/Women prefixes)
      let rates = JSON.parse(localStorage.getItem('laundry_rates'));
      
      if (!rates || !rates.some(r => r.item.includes('Men') || r.item.includes('Women'))) {
        try {
          const response = await fetch('../assets/rates.json');
          rates = await response.json();
          localStorage.setItem('laundry_rates', JSON.stringify(rates));
        } catch (e) { return; }
      }

      const container = document.querySelector(`#${activeCategory} .compact-rate-list`);
      if (!container) return;

      // Filter by category
      let catRates = rates.filter(r => r.category === activeCategory);
      
      // Filter by gender with robust check
      if (activeCategory !== 'shoe-clean') {
        const targetGender = currentGender.toLowerCase();
        catRates = catRates.filter(r => {
          const itemLower = r.item.toLowerCase();
          if (targetGender === 'men') {
            return itemLower.includes('men') && !itemLower.includes('women');
          }
          return itemLower.includes('women');
        });
      }

      if (catRates.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px;">No items found for ${currentGender}.</p>`;
      } else {
        container.innerHTML = catRates.map(rate => {
          const displayName = rate.item.replace('Men ', '').replace('Women ', '').replace('(Men)', '').replace('(Women)', '');
          return `
            <div class="compact-rate-item">
              <div class="item-name-small">${displayName}</div>
              <div style="display: flex; align-items: center; gap: 12px;">
                <span class="item-price-small">₹${rate.price}</span>
                <button class="add-to-cart-btn-small" onclick="window.addToCart('${rate.item}', ${rate.price}, '${activeCategory}')">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }
    }


    window.addEventListener('DOMContentLoaded', () => {
      // Handle Hash
      const hash = window.location.hash.substring(1);
      if (hash && document.getElementById(hash)) {
        activeCategory = hash;
        document.querySelectorAll('.rate-tab-btn').forEach(btn => {
          if (btn.getAttribute('onclick').includes(hash)) {
            document.querySelectorAll('.rate-tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.rate-content').forEach(el => el.classList.remove('active'));
            document.getElementById(hash).classList.add('active');
          }
        });
      }
      renderRates();
    });
  </script>
</body>

</html>
