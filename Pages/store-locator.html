<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Locator | Laundry Basket</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/store-locator.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script defer src="../assets/js/scripts.js"></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="locator-section">
      <div class="locator-header">
        <h1 class="locator-title">Find our <span>store</span> near you</h1>
        <p class="locator-desc">
          Find Laundry Basket laundry and dry clean shop nearby you and experience our world class dry cleaning,
          laundry,
          curtain cleaning, shoe cleaning, carpet cleaning services and much more.
        </p>
      </div>



      <div class="store-grid" id="public-store-grid">
        <!-- Dynamically loaded from localStorage -->
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    function renderPublicStores() {
        const stores = JSON.parse(localStorage.getItem('laundry_stores') || '[]');
        const grid = document.getElementById('public-store-grid');

        if (stores.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted);">No stores found. Check back soon!</p>';
            return;
        }

        grid.innerHTML = stores.map(store => `
            <div class="store-card">
                <h3>Laundry Basket — ${store.name}</h3>
                ${store.address === 'Opening Soon' 
                    ? '<div class="opening-soon-badge">Opening Soon</div>' 
                    : `<p class="store-address">${store.address}</p>`
                }
                
                ${store.address !== 'Opening Soon' ? `
                    <div class="rating-section">
                        <div class="google-logo">
                            <svg viewBox="0 0 48 48" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z" fill="#4285F4"/><path d="M6.3 14.7l6.6 4.8C14.7 15.1 18.9 12 24 12c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 16.3 2 9.7 6.3 6.3 14.7z" fill="#EA4335"/><path d="M24 46c7.7 0 14.4-4.4 17.7-11.3l-6.2-5.2C33.9 32.5 29.4 35 24 35c-5.1 0-9.4-3.1-11.1-7.5l-6.6 5.1C9.6 39.7 16.2 46 24 46z" fill="#34A853"/><path d="M4.6 29.4l6.6-5.1C11.2 24.3 11 24.2 11 24s.2-.3.3-.4l-6.6-5.1C3.8 20.4 3.5 22.2 3.5 24s.3 3.6 1.1 5.4z" fill="#FBBC05"/></svg>
                            <span class="google-rating-label">Google Rating</span>
                        </div>
                        <div class="rating-value">4.8</div>
                        <div class="rating-stars">
                            <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                        </div>
                    </div>
                ` : ''}

                <div class="store-actions">
                    ${store.address !== 'Opening Soon' ? `
                        <a href="${store.mapLink || `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(store.address)}`}" class="action-btn" target="_blank">Get Directions</a>
                    ` : ''}
                    <a href="tel:+919644254425" class="action-btn">Call Now</a>
                    <a href="https://wa.me/919644254425" class="action-btn" target="_blank">WhatsApp</a>
                </div>
            </div>
        `).join('');
    }

    window.addEventListener('DOMContentLoaded', renderPublicStores);
  </script>
    </section>
  </main>

  <div id="site-footer"></div>
</body>

</html>
